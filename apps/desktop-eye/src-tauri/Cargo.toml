[package]
name = "aurion-desktop-eye"
version = "1.0.0"
description = "AURION Eye - Olho de Horus Transparent Desktop Companion & RPA Executor"
authors = ["AURION"]
edition = "2021"

[lib]
name = "aurion_desktop_eye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["macos-private-api"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rdev = "0.5"
enigo = "0.2"
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
